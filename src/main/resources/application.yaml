spring:
  application:
    name: backwork
  mongodb:
    uri: mongodb://localhost:27017/backwork_db

# spring.data.mongodb.uri=mongodb://localhost:27017 # This is the' older spring boot 3 annotation

logging:
  level:
    org:
      springframework:
        data:
          mongodb:
            core:
              MongoTemplate:
                DEBUG


api-docs:
  groups:
    enabled:
      true
  path:
    /v3/api-docs
  enabled:
    true
swagger-ui:
  csrf:
    enabled:
      true
  path:
    /swagger-ui.html
  disable-swagger-default-url:
    true
  url:
    /v3/api-docs
  configUrl:
    /v3/api-docs/swagger-config


server:
  port:
    8187